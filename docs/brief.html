<body class="brief-page">
<div class="toolbar no-print">
  <a class="tb-btn" href="index.html" id="tb-back"></a>
  <span class="tb-title" id="tb-title"></span>
  <span class="tb-space"></span>
  <button class="tb-btn" id="tb-lang">EN</button>

</div>
<form class="brief-form no-print" id="brief-form" autocomplete="off">
  <label><span data-l="country"></span><select id="f-country" required></select></label>
  <label><span data-l="city"></span><input id="f-city" list="city-list" maxlength="80"><datalist id="city-list"></datalist></label>
  <label><span data-l="from"></span><input id="f-from" type="date" required></label>
  <label><span data-l="to"></span><input id="f-to" type="date" required></label>
  <label><span data-l="profile"></span><select id="f-profile"></select></label>
  <label><span data-l="pax"></span><input id="f-pax" type="number" min="1" max="500" value="1"></label>
  <label class="wide"><span data-l="purpose"></span><input id="f-purpose" maxlength="140"></label>
  <label class="wide"><span data-l="lodging"></span><input id="f-lodging" maxlength="140"></label>
  <label class="wide"><span data-l="issuer"></span><input id="f-issuer" maxlength="100"></label>
  <p class="hint wide" data-l="privacy"></p>
</form>
<main id="report" class="report"></main>
