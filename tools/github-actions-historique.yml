# Robot « Historique » : construit la base des 5 dernières années (UCDP, GDELT, USGS, GDACS, NASA, OMS)
# et l'enregistre dans le dépôt (docs/data/history). À lancer à la main (onglet Actions → Historique →
# Run workflow), puis une fois par mois environ pour l'actualiser. Durée : 30 à 90 minutes.
# À placer dans .github/workflows/historique.yml (voir GUIDE_MISE_EN_LIGNE.md).
name: Historique

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Nombre d'années"
        default: "5"
      only:
        description: "Parties (vide = toutes) : usgs gdacs eonet who ucdp gdelt – UCDP se télécharge depuis le PC"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: historique
  cancel-in-progress: false

jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurer la mémoire du robot (avis aux voyageurs)
        uses: actions/cache/restore@v5
        with:
          path: |
            data
            docs/data/profiles.js
          key: robot-${{ github.run_id }}
          restore-keys: robot-
      - name: Construire la base historique
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python historique.py --years "${{ inputs.years }}" --only ${{ inputs.only }} --build
          else
            python historique.py --years "${{ inputs.years }}"
          fi
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "angor-robot"
          git config user.email "angor-robot@users.noreply.github.com"
          git add docs/data/history history_parts
          git commit -m "Base historique mise à jour" || echo "Rien de nouveau"
          git pull --rebase
          git push
      - name: Republier la carte
        run: gh workflow run collecte.yml
        env:
          GH_TOKEN: ${{ github.token }}
